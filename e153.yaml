esphome:
  name: e153
  friendly_name: Volkswagen E153

rp2:
  board: rpipicow
  variant: rp2040

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.1.103
    gateway: 192.168.1.1
    subnet: 255.255.255.0
    dns1: 192.168.1.1

font:
  - id: font_2line
    file: "gfonts://Courier Prime"
    size: 24
spi:
  - id: spi_bus0
    clk_pin: GPIO2
    mosi_pin: GPIO3
output:
  - id: display_backlight
    platform: gpio
    pin: GPIO8
display:
  - id: oled_display
    platform: mipi_spi
    model: ST7789V
    update_interval: 250ms
    cs_pin: GPIO5
    dc_pin: GPIO6
    reset_pin: GPIO7
    rotation: 270
    pages:
      - id: page_temperature
        lambda: |-
          it.print(0, 0, id(font_2line), "temperature info");
      - id: page_battery
        lambda: |-
          it.print(0, 0, id(font_2line), "battery info");

binary_sensor:
  - id: button_temperature
    platform: gpio
    pin: GPIO16
    on_press:
      then:
        - display.page.show: page_temperature
        - output.turn_on: display_backlight
        - delay: 5s
        - output.turn_off: display_backlight
  - id: button_battery
    platform: gpio
    pin: GPIO17
    on_press:
      then:
        - display.page.show: page_battery
        - output.turn_on: display_backlight
        - delay: 5s
        - output.turn_off: display_backlight

