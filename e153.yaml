esphome:
  name: e153
  friendly_name: Volkswagen E153

rp2:
  board: rpipicow
  variant: rp2040

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.1.103
    gateway: 192.168.1.1
    subnet: 255.255.255.0
    dns1: 192.168.1.1

font:
  - id: font_2line
    file: "gfonts://Courier Prime"
    size: 24
spi:
  - id: spi_bus0
    clk_pin: GPIO2
    mosi_pin: GPIO3
output:
  - id: display_backlight
    platform: gpio
    pin: GPIO8
display:
  - id: oled_display
    platform: mipi_spi
    model: ST7789V
    update_interval: 250ms
    cs_pin: GPIO5
    dc_pin: GPIO6
    reset_pin: GPIO7
    rotation: 270
    pages:
      - id: page_temperature
        lambda: |-
          it.print(0, 0, id(font_2line), "temperature");
      - id: page_battery
        lambda: |-
          it.print(0, 0, id(font_2line), "battery");
      - id: page_clock
        lambda: |-
          it.print(0, 0, id(font_2line), "clock");
      - id: page_heat
        lambda: |-
          it.print(0, 0, id(font_2line), "heat");
      - id: page_io
        lambda: |-
          it.print(0, 0, id(font_2line), "I/O");
      - id: page_snowflake
        lambda: |-
          it.print(0, 0, id(font_2line), "snowflake");
      - id: page_up
        lambda: |-
          it.print(0, 0, id(font_2line), "up");
      - id: page_down
        lambda: |-
          it.print(0, 0, id(font_2line), "down");


script:
  - id: backlight_timeout
    mode: restart
    then:
      - output.turn_on: display_backlight
      - delay: 5s
      - output.turn_off: display_backlight
binary_sensor:
  - id: button_temperature
    platform: gpio
    pin: GPIO14
    on_press:
      then:
        - display.page.show: page_temperature
        - lambda: id(backlight_timeout).execute();
  - id: button_battery
    platform: gpio
    pin: GPIO15
    on_press:
      then:
        - display.page.show: page_battery
        - lambda: id(backlight_timeout).execute();
  - id: button_clock
    platform: gpio
    pin: GPIO16
    on_press:
      then:
        - display.page.show: page_clock
        - lambda: id(backlight_timeout).execute();
  - id: button_heat
    platform: gpio
    pin: GPIO17
    on_press:
      then:
        - display.page.show: page_heat
        - lambda: id(backlight_timeout).execute();
  - id: button_io
    platform: gpio
    pin: GPIO18
    on_press:
      then:
        - display.page.show: page_io
        - lambda: id(backlight_timeout).execute();
  - id: button_snowflake
    platform: gpio
    pin: GPIO19
    on_press:
      then:
        - display.page.show: page_snowflake
        - lambda: id(backlight_timeout).execute();
  - id: button_up
    platform: gpio
    pin: GPIO20
    on_press:
      then:
        - display.page.show: page_up
        - lambda: id(backlight_timeout).execute();
  - id: button_down
    platform: gpio
    pin: GPIO21
    on_press:
      then:
        - display.page.show: page_down
        - lambda: id(backlight_timeout).execute();

